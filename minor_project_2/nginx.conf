events {
    worker_connections 1024;
}

http {
    # Logging configuration for visibility (Zero Trust requires extensive logging)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'Token: "$http_authorization"';
    access_log /var/log/nginx/access.log main;

    server {
        # Listening on port 443 (simulating HTTPS edge proxy)
        listen 443;
        server_name localhost;

        # Route to Backend API (Simulating Access Control)
        # In a real ZTA, Nginx would validate the JWT Token from Keycloak here 
        # using auth_request or an external auth module before proxying the request.
        location /api/ {
            # Enforcing explicit request forwarding
            proxy_pass http://zta-secure-api:5678/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route to Identity Provider (Keycloak) for authentication flows
        location /auth/ {
            proxy_pass http://zta-iam-keycloak:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Default deny (Least Privilege Principle)
        location / {
            return 403 "Forbidden: Direct access to edge proxy root is prohibited by Zero Trust policy.\n";
        }
    }
}
